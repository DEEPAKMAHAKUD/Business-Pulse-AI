{% extends "base.html" %}

{% block title %}Delete Business - BusinessPulse AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">Delete Business</h2>
    <p>Are you sure you want to delete "<strong>{{ business.name }}</strong>"?</p>
    <p class="text-muted">This action cannot be undone.</p>
    
    <form method="post">
      {% csrf_token %}
      <div class="d-grid">
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
      </div>
    </form>
    
    <div class="mt-3">
      <a href="{% url 'business_detail' business.id %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </div>
</div>
{% endblock %}
