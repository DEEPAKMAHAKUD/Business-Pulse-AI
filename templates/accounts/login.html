{% extends "base.html" %}

{% block title %}Login - BusinessPulse AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h2 class="mb-4">Login</h2>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
        <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control {% if form.username.errors %}is-invalid{% endif %}" value="{{ form.username.value|default:'' }}" required>
        {% if form.username.errors %}
          <div class="invalid-feedback">
            {{ form.username.errors|first }}
          </div>
        {% endif %}
      </div>
      <div class="mb-3">
        <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
        <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control {% if form.password.errors %}is-invalid{% endif %}" required>
        {% if form.password.errors %}
          <div class="invalid-feedback">
            {{ form.password.errors|first }}
          </div>
        {% endif %}
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Login</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
